apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: construction-agents
  region: us-east-1
  version: "1.34"

managedNodeGroups:
  - name: agents-ng
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        ebs: true
        efs: true
        albIngress: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
