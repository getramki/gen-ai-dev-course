# ExternalName services to reference services in other namespaces
apiVersion: v1
kind: Service
metadata:
  name: construction-cement-agent
  namespace: part-a-purchase-ns
spec:
  type: ExternalName
  externalName: cement-agent-service.part-a-cement-ns.svc.cluster.local
  ports:
  - port: 80
    targetPort: 10002
---
apiVersion: v1
kind: Service
metadata:
  name: construction-steel-agent
  namespace: part-a-purchase-ns
spec:
  type: ExternalName
  externalName: steel-agent-service.part-a-steel-ns.svc.cluster.local
  ports:
  - port: 80
    targetPort: 10003
---
# Rename purchase service for consistent naming
apiVersion: v1
kind: Service
metadata:
  name: construction-purchase-agent
  namespace: part-a-purchase-ns
spec:
  selector:
    app: purchase-agent
  ports:
  - port: 80
    targetPort: 10001
  type: ClusterIP
---
# Single ingress in purchase namespace routing to all services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: construction-agents-ingress
  namespace: part-a-purchase-ns
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: construction-agents
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /purchase/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: construction-purchase-agent
            port:
              number: 80
      - path: /cement/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: construction-cement-agent
            port:
              number: 80
      - path: /steel/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: construction-steel-agent
            port:
              number: 80