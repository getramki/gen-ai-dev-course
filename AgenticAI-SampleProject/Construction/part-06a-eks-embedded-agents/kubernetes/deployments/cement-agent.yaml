apiVersion: apps/v1
kind: Deployment
metadata:
  name: cement-agent
  namespace: part-a-cement-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cement-agent
  template:
    metadata:
      labels:
        app: cement-agent
    spec:
      containers:
      - name: cement-agent
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/construction-cement-agent:latest
        ports:
        - containerPort: 10002
        env:
        - name: AGENT_TYPE
          value: "cement"
        - name: A2A_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: alb-endpoints
              key: cement-endpoint
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: 10002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: 10002
          initialDelaySeconds: 5
          periodSeconds: 5